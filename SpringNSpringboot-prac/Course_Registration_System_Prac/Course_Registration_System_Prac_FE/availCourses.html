<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration System</title>
    <script src="courseAssist.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            gap: 2vh;
            background-color: #fefcfc;

        }

        h2 {
            color: rgb(245, 197, 133);
            margin-left: auto;
            margin-right: auto;
            font-size: 5.7vh;
        }

        table {
            font-size: 3vh;
            font-family: Arial, Helvetica, sans-serif;
            outline: none
        }

        th {
            padding: 2vh;
        }

        td {
            background-color: rgb(254, 245, 233);
            padding: 2vh
        }
    </style>
</head>
<body>
    <h2>Available Courses List</h2>
    <table align="center">
        <tr align="center" style="background-color: bisque;">
            <th width="150">Course Id</th>
            <th width="350">Course Name</th>
            <th width="350">Course Instructor</th>
            <th width="350">Course Duration(in weeks)</th>
        </tr>
        <!-- Available Courses Data will be inserted Dynamically from DB Later -->
        <tbody id="availCoursesTBody" align="center"></tbody>
    </table>

    <script type="text/javascript">
        window.onload = function(){
            showAvailableCourses();
        }  
    </script>
</body>
</html>
